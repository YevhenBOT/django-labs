{% extends 'lab3/base.html' %}
{% block content %}
    <h1 style="text-align: center; color: #2c3e50;">🎮 Ласкаво просимо до нашого магазину ігор!</h1>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px;">
        {% for game in games %}
            <div style="background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; text-align: center;">
                {% if game.image_url %}
                    <img src="{{ game.image_url }}" alt="{{ game.title }}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px;">
                {% endif %}
                <h3>{{ game.title }}</h3>
                <p>Жанр: {{ game.genre.name }}</p>
                <p>Рейтинг: ⭐ {{ game.average_rating }}</p>
                <a href="{% url 'game_detail' game.pk %}">
                    <button style="background-color: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Детальніше</button>
                </a>
            </div>
        {% endfor %}
    </div>
{% endblock %}
