{% extends 'lab3/base.html' %}

{% block content %}
    <h1>Каталог ігор</h1>
    <p>Виберіть гру, щоб дізнатися більше:</p>
    <ul>
        {% for game in games %}
            <li>
                <a href="{% url 'game_detail' game.pk %}">{{ game.title }}</a> 
                — <small>{{ game.genre.name }}</small>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
